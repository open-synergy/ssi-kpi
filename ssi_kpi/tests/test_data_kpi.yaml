        target: "kpi_dept"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Get department appraisal"
        action: "search"
        model: "kpi.department_appraisal"
        domain:
          - ["kpi_id", "=", "EVAL: registry['kpi_dept'].id"]
        save_as: "appraisal"
        limit: 1

      - step: "Confirm department appraisal"
        action: "call"
        target: "appraisal"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert appraisal done"
        action: "assert"
        target: "appraisal"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Mark KPI department as done"
        action: "call"
        target: "kpi_dept"
        method: "action_done"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert KPI result computed"
        action: "assert"
        target: "kpi_dept"
        asserts:
          kpi_result:
            type: "value"
            operator: "is_truthy"

  - name: "KPI Employee - Cancel Workflow"
