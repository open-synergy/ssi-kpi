  - name: "KPI Employee - Appraisal Confirm Blocked When Realization Exceeds Limit"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI Realization Guard"

      - step: "Create KPI item"
        action: "create"
        model: "kpi_item"
        save_as: "kpi_item"
        values:
          name: "Realization Guard Item"
          code: "TITEMRGUARD"

      - step: "Create KPI employee with a realization-limited line"
        action: "create"
        model: "kpi.employee"
        save_as: "kpi_employee_rguard"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          user_ids:
            - - 4
              - "EVAL: env.ref('base.user_admin').id"
          line_ids:
            - - 0
              - 0
              - kpi_item_id: "EVAL: registry['kpi_item'].id"
                weight: 100.0
                target: 100.0
                realization_method: "user"
                use_realization_limit: true
                min_realization_limit: 0.0
                max_realization_limit: 50.0
                score_method: "higher"

      - step: "Confirm KPI employee"
        action: "call"
        target: "kpi_employee_rguard"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve KPI employee"
        action: "call"
        target: "kpi_employee_rguard"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Get appraisal"
        action: "search"
        model: "kpi.employee_appraisal"
        domain:
          - ["kpi_id", "=", "EVAL: registry['kpi_employee_rguard'].id"]
        save_as: "appraisal_rguard"
        limit: 1

      - step: "Get appraisal line"
        action: "search"
        model: "kpi.employee_appraisal_line"
        domain:
          - ["kpi_appraisal_id", "=", "EVAL: registry['appraisal_rguard'].id"]
        save_as: "appraisal_line_rguard"
        limit: 1

      - step: "Set realization above the allowed limit"
        action: "write"
        target: "appraisal_line_rguard"
        values:
          realization: 80.0

      - step: "Confirm appraisal must be rejected: realization out of range"
        action: "call"
        target: "appraisal_rguard"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "UserError"
          message_contains: "out of range"
