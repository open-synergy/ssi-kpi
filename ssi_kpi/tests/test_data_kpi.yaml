        model: "kpi.employee"
        save_as: "kpi_employee_compute"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          line_ids:
            - - 0
              - 0
              - kpi_item_id: "EVAL: registry['kpi_item_60'].id"
                weight: 60.0
                target: 100.0
                realization_method: "python"
                python_code: "result = 100.0"
                score_method: "higher"
            - - 0
              - 0
              - kpi_item_id: "EVAL: registry['kpi_item_40'].id"
                weight: 40.0
                target: 100.0
                realization_method: "python"
                python_code: "result = 100.0"
