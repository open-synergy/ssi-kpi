      - step: "Assert KPI department in draft"
        action: "assert"
        target: "kpi_dept"
        asserts:
          state:
            type: "value"
            expected: "draft"
          amount_weight:
            type: "value"
            expected: 100.0

      - step: "Confirm KPI department"
        action: "call"
        target: "kpi_dept"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
