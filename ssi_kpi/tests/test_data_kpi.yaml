  - name: "KPI Employee - Weight and Final Score Compute"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI Compute"

      - step: "Create KPI item - Weight 60"
        action: "create"
        model: "kpi_item"
        save_as: "kpi_item_60"
        values:
          name: "Weight 60 Item"
          code: "TITEMCMP60"

      - step: "Create KPI item - Weight 40"
        action: "create"
        model: "kpi_item"
        save_as: "kpi_item_40"
        values:
          name: "Weight 40 Item"
          code: "TITEMCMP40"

      - step: "Create KPI employee with two weighted lines"
