  - name: "KPI Employee - Confirm Blocked When Weight Not 100"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI Weight Guard"

      - step: "Create KPI item"
        action: "create"
        model: "kpi_item"
        save_as: "kpi_item"
        values:
          name: "Weight Guard Item"
          code: "TITEMWGUARD"

      - step: "Create KPI employee with incomplete weight"
        action: "create"
        model: "kpi.employee"
        save_as: "kpi_employee_wguard"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          line_ids:
            - - 0
              - 0
              - kpi_item_id: "EVAL: registry['kpi_item'].id"
                weight: 50.0
                target: 100.0
                realization_method: "python"
                python_code: "result = 100.0"
                score_method: "higher"

      - step: "Assert weight below 100"
        action: "assert"
        target: "kpi_employee_wguard"
        asserts:
          amount_weight:
            type: "value"
            expected: 50.0

      - step: "Confirm must be rejected: total weight is not 100%"
        action: "call"
