  - name: "KPI Employee - Operating Unit Record Rule Blocks Outsider"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI OU Rule"

      - step: "Create KPI employee with operating unit"
        action: "create"
        model: "kpi.employee"
        save_as: "kpi_employee"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          operating_unit_id: "REC: operating_unit.id"

      - step: "Create user outside the record's operating unit"
        action: "create"
        model: "res.users"
        save_as: "ou_outsider"
        as_user: "base.user_admin"
        values:
          name: "KPI Employee OU Outsider"
          login: "kpi_employee_ou_outsider@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_kpi_operating_unit.kpi_employee_ou_group",
                ],
              ],
            ]
          # Without this, `assigned_operating_unit_ids` defaults to
          # the ACTING user's (base.user_admin's) default operating
          # unit (operating_unit.operating_unit_default_get() reads
          # self.env.user, not the record being created) -- which is
          # the SAME operating unit as "operating_unit" above, making
          # the outsider not actually an outsider.
          assigned_operating_unit_ids: [[6, 0, []]]

      - step: "Search the record as the outsider user"
        action: "search"
        model: "kpi.employee"
        domain: [["id", "=", "REC: kpi_employee.id"]]
        save_as: "outsider_result"
        as_user: "ou_outsider"
        expect_count: 0

