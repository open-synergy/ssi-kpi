scenarios:
  - name: "KPI Employee - Create with Operating Unit"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI OU"

      - step: "Create KPI employee with operating unit"
        action: "create"
        model: "kpi.employee"
        save_as: "kpi_employee"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert KPI employee has operating unit"
        action: "assert"
        target: "kpi_employee"
        asserts:
          state:
            type: "value"
            expected: "draft"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "KPI Department - Create with Operating Unit"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
