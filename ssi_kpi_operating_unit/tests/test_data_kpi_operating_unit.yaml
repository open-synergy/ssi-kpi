  - name: "KPI Employee Appraisal - Create with Operating Unit"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee KPI Appraisal OU"

      - step: "Create parent KPI employee with operating unit"
        action: "create"
        model: "kpi.employee"
        save_as: "kpi_employee"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Create KPI employee appraisal with the same operating unit"
        action: "create"
        model: "kpi.employee_appraisal"
        save_as: "appraisal"
        as_user: "base.user_admin"
        values:
          kpi_id: "REC: kpi_employee.id"
          operating_unit_id: "REC: kpi_employee.operating_unit_id.id"

      - step: "Assert appraisal operating unit matches its parent"
        action: "assert"
        target: "appraisal"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: kpi_employee.operating_unit_id"

